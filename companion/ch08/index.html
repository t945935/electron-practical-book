<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自己的工具，自己做</title><link rel="stylesheet" href="styles.css"></head><body><h1>支出記帳與 CSV 報表</h1><form id="form"><label>日期 <input id="date" type="date" required></label><label>分類 <input id="category" maxlength="80" required></label><label>備註 <input id="note" maxlength="500"></label><label>金額 <input id="amount" inputmode="decimal" placeholder="0.00" required></label><button>新增支出</button></form><nav><button id="importCSV">匯入（取代帳本）</button><button id="exportCSV">匯出 CSV</button></nav><h2 id="total"></h2><ul id="groups"></ul><table><thead><tr><th>日期</th><th>分類</th><th>備註</th><th>金額</th></tr></thead><tbody id="rows"></tbody></table><p id="status" role="status" aria-live="polite">就緒</p><script src="renderer.js"></script></body></html>
