<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="style.css"><title>系統匣休息提醒</title></head><body><h1>系統匣休息提醒</h1><label>幾秒後提醒 <input id="seconds" type="number" min="5" max="86400" value="10"></label><button id="schedule">排定</button><button id="quick15">十五分鐘後提醒</button><button id="cancel">取消提醒</button><button id="quit">結束程式</button><p id="status" role="status">正在初始化</p><p id="due"></p><small>關閉視窗會隱藏到系統匣；請用「結束程式」退出。休眠期間不能保證準時，程式結束後不再提醒。</small><small>通知支援不等於已獲權限；未看到通知時，檢查 Windows 設定 → 系統 → 通知及勿擾模式。</small><script src="renderer.js"></script></body></html>
