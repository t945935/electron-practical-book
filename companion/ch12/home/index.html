<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自己的工具箱</title><link rel="stylesheet" href="style.css"></head><body><main><h1>自己的工具箱</h1><p>每個工具只開一個視窗。關閉入口或按結束，會先確認尚未儲存的筆記。</p><nav id="tools" aria-label="工具"></nav><h2>共用入口設定</h2><label>啟動時加開 <select id="startup"><option value="home">只顯示工具箱</option></select></label><button id="save">儲存設定</button><button id="quit">結束整個工具箱</button><p id="status" role="status"></p><p>關閉提醒視窗會隱藏至系統匣；關閉入口則結束全部工具。計時器與提醒不跨重新啟動保存。</p></main><script src="renderer.js"></script></body></html>
