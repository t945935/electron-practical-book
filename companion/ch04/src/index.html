<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自己的工具，自己做</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>自己的工具，自己做</h1>
    <p>一次只做一件事。先選秒數，再按重設套用。</p>
    <p>應用程式版本：<strong id="version">0.1.0</strong></p>
    <p>關閉視窗即可結束；macOS 請使用應用程式選單結束。</p>
    <label for="seconds">專注秒數（1 至 3600）</label>
    <input id="seconds" type="number" min="1" max="3600" step="1" value="1500">
    <p id="clock" role="timer" aria-label="剩餘時間">25:00</p>
    <p id="status" role="status" aria-live="polite">準備開始</p>
    <button id="start" type="button">開始／繼續</button>
    <button id="pause" type="button" disabled>暫停</button>
    <button id="reset" type="button">重設並套用秒數</button>
    <p id="message" role="alert"></p>
  </main>
  <script type="module" src="renderer.js"></script>
</body>
</html>
